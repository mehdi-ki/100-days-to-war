plugins {
    id 'base'
}

ext {
    appName = '100-Days-to-War'
    gdxVersion = '1.14.2'
    gameVersion = '0.1.0'
}

allprojects {
    group = 'com.mehdi.daystowar'
    version = gameVersion
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            // Java 17 is the compatibility baseline for Linux users. The
            // release is still built and shipped as a self-contained AppImage.
            languageVersion = JavaLanguageVersion.of(17)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
        options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
