name: Build Linux AppImage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8'

      - name: Test and install distribution
        run: gradle test :lwjgl3:installDist --no-daemon

      - name: Download appimagetool
        run: |
          curl --fail --location \
            --output appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: bash ./scripts/build-appimage.sh --skip-build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: 100-Days-to-War-AppImage
          path: release/100-Days-to-War-v0.2.0-x86_64.AppImage
